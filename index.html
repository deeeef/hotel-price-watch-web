<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏨</text></svg>">
<title>숙박 가격 감시</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1b1f24; --dim: #6b7480;
    --down: #1a7f37; --up: #c9372c; --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --line: #272d36; --text: #e6e9ee; --dim: #98a2b0;
            --down: #3fb950; --up: #f85149; --accent: #4c8dff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0; }
  .dim { color: var(--dim); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; scroll-margin-top: 12px; }
  .card:target { outline: 2px solid var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 { font-size: 17px; margin: 0 0 2px; }
  .price { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .chg { font-size: 13px; font-weight: 600; }
  .down { color: var(--down); } .up { color: var(--up); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: 12px; color: var(--dim); border: 1px solid var(--line);
         border-radius: 999px; padding: 1px 8px; margin-right: 4px; }
  .err { color: var(--up); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  svg { width: 100%; height: 170px; display: block; margin: 10px 0 2px; overflow: visible; }
  .empty { color: var(--dim); padding: 20px 0; }
</style>
</head>
<body>
<header><h1>숙박 가격 감시</h1><span class="dim" id="updated"></span></header>
<div id="app"><p class="empty">불러오는 중…</p></div>

<script>
const won = n => n == null ? "–" : "₩" + n.toLocaleString("ko-KR");
const man = n => n == null ? "–" : (n / 10000).toFixed(1) + "만";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function chart(points) {
  const pts = points.filter(p => p.best != null);
  if (pts.length < 2) return '<p class="dim">기록이 2회 이상 쌓이면 그래프가 나옵니다.</p>';
  const W = 700, H = 170, padL = 52, padR = 10, padT = 12, padB = 22;
  const xs = pts.map(p => new Date(p.at).getTime());
  const ys = pts.map(p => p.best);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  let [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  if (y0 === y1) { y0 -= 1000; y1 += 1000; }
  const pad = (y1 - y0) * 0.12; y0 -= pad; y1 += pad;
  const X = t => padL + (W - padL - padR) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = v => padT + (H - padT - padB) * (1 - (v - y0) / (y1 - y0));
  const line = pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p.best).toFixed(1)).join(" ");
  const area = line + ` L ${X(x1).toFixed(1)} ${H - padB} L ${X(x0).toFixed(1)} ${H - padB} Z`;
  const fmt = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + "시"; };
  const last = pts[pts.length - 1], lo = Math.min(...ys);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="가격 추이">
    <line x1="${padL}" y1="${Y(y1 - pad).toFixed(1)}" x2="${W - padR}" y2="${Y(y1 - pad).toFixed(1)}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${Y(lo).toFixed(1)}" x2="${W - padR}" y2="${Y(lo).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="0" y="${(Y(y1 - pad) + 4).toFixed(1)}" font-size="11" fill="var(--dim)">${man(Math.round(y1 - pad))}</text>
    <text x="0" y="${(Y(lo) + 4).toFixed(1)}" font-size="11" fill="var(--dim)">${man(lo)}</text>
    <path d="${area}" fill="var(--accent)" opacity="0.10"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(xs[xs.length - 1]).toFixed(1)}" cy="${Y(last.best).toFixed(1)}" r="3.5" fill="var(--accent)"/>
    <text x="${padL}" y="${H - 6}" font-size="11" fill="var(--dim)">${fmt(x0)}</text>
    <text x="${W - padR}" y="${H - 6}" font-size="11" fill="var(--dim)" text-anchor="end">${fmt(x1)}</text>
  </svg>`;
}

function hotelCard(h) {
  const pts = (h.series && h.series.length ? h.series : h.points).filter(p => p.best != null);
  const cur = pts.length ? pts[pts.length - 1].best : null;
  const prev = pts.length > 1 ? pts[pts.length - 2].best : null;
  const diff = cur != null && prev != null ? cur - prev : 0;
  const chg = diff ? `<span class="chg ${diff < 0 ? "down" : "up"}">${diff < 0 ? "▼" : "▲"} ${won(Math.abs(diff))}</span>` : "";
  const lo = pts.length ? Math.min(...pts.map(p => p.best)) : null;
  const srcRows = Object.values(h.sources || {}).map(s =>
    `<span class="tag">${esc(s.label)}${s.error ? ' <span class="err">실패</span>' : (s.found != null ? " " + s.found + "건" : "")}</span>`).join("");
  const offers = (h.offers || []).map((o, i) => `<tr>
      <td>${i + 1}. ${esc(o.source)}<div class="dim">${esc(o.room)}${o.plan ? " · " + esc(o.plan) : ""}</div></td>
      <td class="num">${won(o.total_krw)}${o.url ? `<div><a href="${esc(o.url)}" target="_blank" rel="noopener">열기</a></div>` : ""}</td>
    </tr>`).join("");
  const recent = h.points.slice(-24).reverse().map(p => `<tr>
      <td>${esc(p.ts)}</td><td>${esc(p.source ?? "–")}</td>
      <td class="num">${won(p.best)}</td><td class="num dim">${p.found ?? "–"}건</td>
    </tr>`).join("");
  return `<section class="card" id="${esc(h.id)}">
    <div class="row">
      <div>
        <h2>${esc(h.name)}${h.enabled === false ? ' <span class="tag">감시 중지</span>' : ""}</h2>
        <div class="dim">${esc(h.room_label)} · 성인 ${h.adults} · ${esc(h.conditions || "조건 없음")}</div>
        <div class="dim">${esc(h.checkin)} ~ ${esc(h.checkout)} (${h.nights}박) · 갱신 ${esc(h.updated || "")}${h.found != null ? ` · 이번 조회 <b>${h.found}건</b>` : ""}</div>
      </div>
      <div style="text-align:right">
        <div class="price">${won(cur)}</div>
        <div>${chg}${lo != null && cur != null ? ` <span class="dim">최저 ${man(lo)}</span>` : ""}</div>
      </div>
    </div>
    ${chart(h.series && h.series.length ? h.series : h.points)}
    <div>${srcRows}</div>
    <details><summary>현재 싼 순 — 조건 일치 ${h.found ?? (h.offers || []).length}건 중 상위 ${(h.offers || []).length}건</summary>
      <table><thead><tr><th>출처 · 룸 · 조건</th><th class="num">총액</th></tr></thead><tbody>${offers || '<tr><td colspan="2" class="dim">조건에 맞는 요금 없음</td></tr>'}</tbody></table>
    </details>
    <details><summary>최근 조회 기록 (${h.points.length}회 중 최신 24회)</summary>
      <table><thead><tr><th>시각</th><th>최저가 출처</th><th class="num">최저가</th><th class="num">건수</th></tr></thead><tbody>${recent}</tbody></table>
    </details>
  </section>`;
}

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => {
  document.getElementById("updated").textContent = "업데이트 " + d.generated_at;
  document.getElementById("app").innerHTML = d.hotels.length
    ? d.hotels.map(hotelCard).join("")
    : '<p class="empty">아직 기록이 없습니다.</p>';
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}).catch(e => {
  document.getElementById("app").innerHTML = '<p class="empty">기록을 불러오지 못했습니다: ' + esc(e.message) + "</p>";
});
</script>
</body>
</html>
